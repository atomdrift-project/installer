# hood — rendered into hood.sh by tools/render.sh.
#
# Sourced by the renderer, so this is sh syntax, not a data format. Every
# variable below fills the @TOKEN@ of the same name in templates/install.sh.in.

DISPLAY="Atomdrift Hood"
TAGLINE="local enforcement for what package managers,
installers, and curl fetch, before it reaches your machine."
READY="Ready to install shims"
FOOTER="Add shims with: hood install — then restart your shell."

REPO="atomdrift-project/hood"
BIN="hood"
ENV="HOOD"
UI_ENV="HOOD"

# No tap formula yet, so the brew method declines instead of guessing at one.
FORMULA=""
FORMULA_DEPS=""

# Kept in step with hood's .github/workflows/build.yml, which release.yml
# reuses. hood has published no release yet: until it does, every platform
# below resolves to no asset and the source path takes over.
TARGETS="x86_64-unknown-linux-gnu
aarch64-unknown-linux-gnu
x86_64-unknown-linux-musl
aarch64-unknown-linux-musl
arm-unknown-linux-musleabihf
armv7-unknown-linux-musleabihf
loongarch64-unknown-linux-musl
s390x-unknown-linux-gnu
riscv64gc-unknown-linux-gnu
powerpc64le-unknown-linux-gnu
aarch64-apple-darwin
x86_64-apple-darwin
x86_64-unknown-freebsd
x86_64-unknown-openbsd
x86_64-unknown-netbsd
x86_64-unknown-illumos
x86_64-pc-solaris"

EXAMPLES="shims:install
check:exec -- npm ci
explore:--help"

# hood has cut no release yet, so a source build may take the branch.
# Empty this the moment the first tag exists.
UNRELEASED_REF="main"

WINDOWS_HINT="hood has no Windows installer yet
   Use Windows Subsystem for Linux, or build from source with cargo."

SOURCE_GB=10
BUILD_NOTE="(the analysis stack is large — expect minutes)"
TOOLS_BARE="core scanner ready"
UPDATE_COMMAND=""
