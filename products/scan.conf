# Atomdrift Scan — rendered into scan.sh by tools/render.sh.
#
# Sourced by the renderer, so this is sh syntax, not a data format. Every
# variable below fills the @TOKEN@ of the same name in templates/install.sh.in.

DISPLAY="Atomdrift Scan"
TAGLINE="malware and supply-chain analysis for files,
directories, archives, packages, URLs, and processes."
READY="Ready to scan"
FOOTER="Installer refreshes models, rules, and bloom filters when possible; future scans update them when stale."

REPO="atomdrift-project/scan"
BIN="atomscan"
ENV="ATOMSCAN"
# atomscan reads SCAN_THEME and SCAN_ASCII for its own UI; the installer follows
# the tool rather than inventing a second pair of switches.
UI_ENV="SCAN"

FORMULA="scan"
# atomscan links cleave as a library, and Homebrew 6 trusts each non-official
# formula individually, so the dependency needs naming alongside it.
FORMULA_DEPS="cleave"

# Kept in step with scan's .github/workflows/release.yml; tests/platforms.sh
# compares this list against that workflow when the checkout is available.
TARGETS="x86_64-unknown-linux-gnu
aarch64-unknown-linux-gnu
x86_64-unknown-linux-musl
aarch64-unknown-linux-musl
loongarch64-unknown-linux-musl
s390x-unknown-linux-gnu
riscv64gc-unknown-linux-gnu
powerpc64le-unknown-linux-gnu
aarch64-apple-darwin
x86_64-apple-darwin
x86_64-unknown-freebsd
x86_64-unknown-openbsd
x86_64-unknown-netbsd
x86_64-unknown-illumos"

EXAMPLES="project:./project
package:purl npm/left-pad@1.3.0
explore:--help"

# scan has releases, so a source build always resolves a tag.
UNRELEASED_REF=""

WINDOWS_HINT="on Windows, use install.ps1 instead:
   irm https://install.atomdrift.org/scan.ps1 | iex"

SOURCE_GB=10
BUILD_NOTE="(the analysis stack is large — expect minutes)"
TOOLS_BARE="core scanner ready"
UPDATE_COMMAND="update-rules"
