# isomer — rendered into isomer.sh by tools/render.sh.
#
# Sourced by the renderer, so this is sh syntax, not a data format. Every
# variable below fills the @TOKEN@ of the same name in templates/install.sh.in.

DISPLAY="isomer"
TAGLINE="differential supply-chain analysis. It judges what a
change does that the code before it did not."
READY="Ready to compare"
FOOTER="isomer is an early build; flags and output formats still change."

REPO="atomdrift-project/isomer"
BIN="isomer"
ENV="ISOMER"
UI_ENV="ISOMER"

# No tap formula yet, so the brew method declines instead of guessing at one.
FORMULA=""
FORMULA_DEPS=""

# isomer's .github/workflows/release.yml publishes the four platforms
# isomer-action consumes. The rest of the family's targets follow when its
# matrix does; until then this list is what actually exists, and anything else
# takes the source path.
TARGETS="x86_64-unknown-linux-musl
aarch64-unknown-linux-musl
aarch64-apple-darwin
x86_64-apple-darwin"

EXAMPLES="ci:ci
compare:fs ./before ./after
explore:--help"

# isomer has releases, so a source build always resolves a tag.
UNRELEASED_REF=""

WINDOWS_HINT="isomer has no Windows installer yet
   Use Windows Subsystem for Linux, or build from source with cargo."

SOURCE_GB=5
BUILD_NOTE="(expect a few minutes)"
TOOLS_BARE="core analyzer ready"
UPDATE_COMMAND=""
