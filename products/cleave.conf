# cleave — rendered into cleave.sh by tools/render.sh.
#
# Sourced by the renderer, so this is sh syntax, not a data format. Every
# variable below fills the @TOKEN@ of the same name in templates/install.sh.in.

DISPLAY="cleave"
TAGLINE="static analysis that answers what a program can do,
across source, binaries, bytecode, documents, packages, and archives."
READY="Ready to cleave"
FOOTER="First run fetches the traits rule bundle."

REPO="atomdrift-project/cleave"
BIN="cleave"
ENV="CLEAVE"
UI_ENV="CLEAVE"

FORMULA="cleave"
# The cleave formula pulls its own dependencies from Homebrew core, which needs
# no trust grant of its own.
FORMULA_DEPS=""

# Kept in step with cleave's .github/workflows/build.yml, which release.yml
# reuses. cleave has not yet picked up every target scan publishes; add them
# here as its matrix grows.
TARGETS="x86_64-unknown-linux-gnu
aarch64-unknown-linux-gnu
x86_64-unknown-linux-musl
aarch64-unknown-linux-musl
arm-unknown-linux-musleabihf
armv7-unknown-linux-musleabihf
loongarch64-unknown-linux-musl
s390x-unknown-linux-gnu
riscv64gc-unknown-linux-gnu
powerpc64le-unknown-linux-gnu
aarch64-apple-darwin
x86_64-apple-darwin
x86_64-unknown-freebsd
x86_64-unknown-openbsd
x86_64-unknown-netbsd
x86_64-unknown-illumos
x86_64-pc-solaris"

EXAMPLES="analyze:suspect.bin
compare:diff v1.2.0/ v1.3.0/
explore:--help"

# cleave has releases, so a source build always resolves a tag.
UNRELEASED_REF=""

WINDOWS_HINT="cleave has no Windows installer yet
   Use Windows Subsystem for Linux, or build from source with cargo."

SOURCE_GB=10
BUILD_NOTE="(the analysis stack is large — expect minutes)"
TOOLS_BARE="core analyzer ready"
